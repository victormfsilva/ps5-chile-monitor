name: monitor-ps5-chile

on:
  schedule:
    - cron: "*/5 * * * *"    # a cada 5 min (o GitHub às vezes atrasa alguns minutos)
    - cron: "3-58/10 * * * *" # reserva, fora dos minutos "redondos" (menos fila no GitHub)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: monitor-ps5
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Checar preços e avisar no Telegram
        run: python3 monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}

      - name: Salvar memória (o que já foi avisado)
        if: always()
        run: |
          git config user.name "monitor-ps5"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "estado $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
